spring.application.name=criminal-network-intelligence

server.port=${PORT:8080}

# =========================================================
# PostgreSQL 18
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/criminal_network_intelligence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# =========================================================
# Server Error Attributes
# =========================================================
server.error.include-message=always

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Neo4j
# =========================================================
spring.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD:CrimeNet@2026}

# =========================================================
# AI Service
# =========================================================
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

# =========================================================
# JWT Security
# =========================================================
security.jwt.secret=${JWT_SECRET:SIH2026CriminalNetworkIntelligenceSecureJwtSecretKeyForDevelopmentOnly}
security.jwt.expiration=86400000

# =========================================================
# CORS Production Origins
# =========================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://crime-net-ai-1dsp.vercel.app}

# =========================================================
# File Upload
# =========================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# =========================================================
# Logging
# =========================================================
logging.level.criminal_network_intelligence=INFO
logging.level.org.springframework.security=WARN

# =========================================================
# Authorized External Integrations
# =========================================================
integration.aadhaar.enabled=${INTEGRATION_AADHAAR_ENABLED:false}
integration.aadhaar.provider-url=${INTEGRATION_AADHAAR_URL:}

integration.cdr.enabled=${INTEGRATION_CDR_ENABLED:false}
integration.cdr.provider-url=${INTEGRATION_CDR_URL:}

integration.banking.enabled=${INTEGRATION_BANKING_ENABLED:false}
integration.banking.provider-url=${INTEGRATION_BANKING_URL:}

integration.vehicle.enabled=${INTEGRATION_VEHICLE_ENABLED:false}
integration.vehicle.provider-url=${INTEGRATION_VEHICLE_URL:}

integration.crime.enabled=${INTEGRATION_CRIME_ENABLED:false}
integration.crime.provider-url=${INTEGRATION_CRIME_URL:}