spring.application.name=criminal-network-intelligence

server.port=8080

# =========================================================
# PostgreSQL 18
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/criminal_network_intelligence
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Neo4j
# =========================================================
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=neo4j
spring.neo4j.authentication.password=CrimeNet@2026

# =========================================================
# AI Service
# =========================================================
ai.service.url=http://127.0.0.1:8000

# =========================================================
# JWT Security
# =========================================================
security.jwt.secret=SIH2026CriminalNetworkIntelligenceSecureJwtSecretKeyForDevelopmentOnly
security.jwt.expiration=86400000

# =========================================================
# File Upload
# =========================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# =========================================================
# Logging
# =========================================================
logging.level.criminal_network_intelligence=INFO
logging.level.org.springframework.security=WARN

# =========================================================
# Authorized External Integrations
# =========================================================
integration.aadhaar.enabled=false
integration.aadhaar.provider-url=

integration.cdr.enabled=false
integration.cdr.provider-url=

integration.banking.enabled=false
integration.banking.provider-url=

integration.vehicle.enabled=false
integration.vehicle.provider-url=

integration.crime.enabled=false
integration.crime.provider-url=